; Patient speech. Section = trigger, key = age group (adult/child/elderly) or "any".
; Lines are picked at random, except "ramble" which plays in order.
; Voice files are optional: assets/audio/voice/<trigger>_<index>.ogg (index starts at 0).

[pain]
any=["Ah- AH! What are you doing?!", "That hurts. That really hurts.", "Stop, stop, stop!", "I can FEEL that!", "Is that supposed to feel like that?"]
child=["OWWW!", "I want my mom!", "You said it wouldn't hurt!", "I'm telling!"]

[calm]
any=["Okay. Okay. I'm okay.", "Is it bad? Don't tell me.", "You guys look tired.", "Is that my blood? That's a lot of my blood.", "Can I get a sticker after this?"]
child=["Are you a real doctor?", "Can I see it?", "Do you have a dog?"]

[panic]
any=["I can't breathe, I can't breathe-", "Get me out of here!", "I changed my mind! I changed my mind!", "Don't let me die in here!"]
child=["NO NO NO NO", "MOM! MOOOOM!", "I'll be good, I promise!"]

[reassured]
any=["...okay. Thank you.", "Just talk to me. Keep talking.", "Alright. Alright."]
child=["...okay.", "Can you hold my hand?"]

[wake_up]
any=["Wh- where... why can I see the ceiling?", "Is it over? It's not over. Why is it not over?", "Why do I feel cold inside?", "I can hear you. I can hear EVERYTHING."]

[hint]
any=["My left side feels strange. Like it's upside down.", "I'm really thirsty. I'm always really thirsty.", "Last time I had surgery I woke up halfway through.", "Last time the doctors gave me something and my face blew up like a balloon.", "My blood's weird. Nobody ever has my type.", "I bruise if you look at me.", "Don't bleach my tattoos, they're load bearing."]

[lie]
any=["I'm allergic to everything. Probably. I read it online.", "I've got a titanium skeleton. From the army.", "My heart's in my stomach. Mom always said.", "I once took a bullet for the mayor."]

[tickle]
any=["Hehe- stop, that tickles!", "HAH- no- not there-", "Why are you poking me there?!"]

[dying]
any=["It's getting dark in here...", "Tell my... tell my...", "Cold. So cold."]

[ramble]
any=["So this is it, huh. Huh.", "You know what the worst part is? I never finished that crossword. Seven letters, 'ending'. I'm not kidding. I'm not.", "I had a goldfish named Gerald. Gerald outlived three landlords. Gerald's still alive. Who's feeding Gerald?", "When I was nine I stole a garden gnome. I think about that gnome every day. His name was Dennis. I named him after I stole him.", "If there's an afterlife, I hope it has vending machines. The good ones. With the spiral.", "I want it on record that I was right about the thing. The thing with the neighbors. I was RIGHT.", "Is that whiskey? Is that for me? It better be for me.", "You've got kind eyes. Tired, but kind. Get some sleep, doc.", "Tell Gerald... tell Gerald I said... bubbles.", "...", "...you still here? Good. That's good."]
