; Tools every surgery starts with on the instrument tray. Everything else is ordered from the nurse.
; Scenarios add only what the nurse can't fetch (see ScenarioDef.roll_tools()), or their whole kit when there's no nurse.
; A tool listed twice spawns twice.

[starter_kit]
tools=["scalpel", "forceps", "kidney_dish", "cotton_pad", "cotton_pad", "cotton_pad", "cotton_pad", "iodine_bottle", "iodine_dish", "iv_catheter", "saline_bag"]
