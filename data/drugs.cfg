; Every drug, fluid and questionable substance. Section name = drug id.
; Effects ramp in over `onset` seconds and fade over `duration` seconds.
; Direct injection: onset x0.4, strength x1.3 (spiky). IV drip: onset x1.5, strength x1.0 (smooth).
;
; hr / bp          Heart rate (bpm) and systolic pressure (mmHg) offset at peak.
; glucose          Total glucose change (mmol/L) spread over the duration.
; volume_ml        Total blood volume added over the duration.
; anesthesia       General anesthesia depth at peak (0-1, 0.7+ is under).
; local_block      Local numbness at the site (0-1).
; sedation         Calms panic and lowers consciousness (0-1).
; pain_relief      Pain removed at peak (0-1).
; clot             +: blood clots faster (less bleeding, more clot risk). -: thinner blood.
; spo2 / temp      Oxygen saturation and temperature offset.
; flags            antibiotic, antihistamine, anticonvulsant, antiarrhythmic, restart, reverse_opioid,
;                  opioid, mh_trigger, mh_cure, lethal, sanitize, stimulant, allergen_candidate
; danger_with      Other drug ids. Both active at once = cardiac event.
; blood_type       For blood packs.

