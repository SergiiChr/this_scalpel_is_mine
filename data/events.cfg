; Random escalation events. The director picks from the scenario's `events` list.
; weight      Relative pick chance.
; cooldown    Seconds before the same event can happen again.
; min_time    Earliest time (s) it can fire.
; requires    Optional: patient effect key that must be present (e.g. seizure_chance), or "awake".
; Behaviour for each id lives in src/surgery/events/event_director.gd.

[bleed_spike]
weight=3.0
cooldown=120
min_time=90
text="A vessel gives way!"

[arrest]
weight=1.0
cooldown=240
min_time=240
text="The monitor screams. Cardiac arrest!"

[wake_up]
weight=1.5
cooldown=180
min_time=180
text="The patient is surfacing..."

[seizure]
weight=2.0
cooldown=90
min_time=60
text="Seizure!"

[panic_flail]
weight=0.0
cooldown=20
min_time=0
requires="awake"
text="The patient thrashes!"

[patient_talk]
weight=0.0
cooldown=15
min_time=5
requires="awake"
text=""

[cough]
weight=2.0
cooldown=40
min_time=30
text="Coughing fit!"

[pedestrian_bump]
weight=4.0
cooldown=25
min_time=20
text="Someone shoves past you!"

[pothole]
weight=5.0
cooldown=12
min_time=5
text="Pothole!"

[lights_flicker]
weight=1.0
cooldown=120
min_time=60
text=""

[ramble]
weight=0.0
cooldown=12
min_time=10
text=""
