; Random escalation events. The director picks from the scenario's `events` list.
; weight      Relative pick chance.
; cooldown    Seconds before the same event can happen again.
; min_time    Earliest time (s) it can fire.
; requires    Optional: patient effect key that must be present (e.g. seizure_chance) or "awake".
; Random events only disturb the surgeons. What happens to the patient follows from the patient and from what the
; surgeons do, so a player can read it off the chart and the monitor and look it up in the manual.
; Weight 0: never rolled, only scripted (a scenario's scripted_events) or triggered by the game itself.
; Behaviour for each id lives in src/Operation/EventDirector.cs.

[arrest]
text=""

[wake_up]
text="The patient is surfacing..."

[panic_flail]
weight=0.0
cooldown=20
min_time=0
requires="awake"
text="The patient thrashes!"

