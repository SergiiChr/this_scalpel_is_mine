; Scenario definition. Format reference: docs/DESIGN.md#scenarios

[scenario]

order=24
title="Glass Shards"
difficulty=2
group="Lacerations"
description="Went through a glass door. Six pieces are still in the arm, one sunk out of sight under its cut, and the patient won't hold still."
complaint="Glass fragments embedded in the left upper arm, near the shoulder, after a fall through a glass door. Fragments still in place. Patient conscious, extremely agitated."
hidden=false
time_limit=0
anesthesia="local"
site="shoulder"
side="front"
start_orientation=0
patient_age="adult"
environment="or"
nurse=true
dirty_start=true
patient_quirks_min=0
patient_quirks_max=1
patient_quirk_pool=["diabetes", "coagulation", "chatterbox", "thin_skin", "ticklish", "tattooed", "alcoholic"]
fixed_patient_quirks=[]
starting_tools=["forceps", "hemostat", "needle", "gauze", "cautery", "vial_diazepam", "vial_lidocaine", "iv_catheter", "saline_bag", "kidney_dish"]
random_tools=["skin_stapler", "vial_txa", "surgical_tape"]
random_tool_count=1
missing_tool_chance=0.0
events=["panic_flail", "patient_talk"]
scripted_events=[]
start_vitals={"panic": 0.9, "pain": 0.7}
preop={}

[patient]

; Each shard plugs the cut it went in by (embedded): it bleeds once the shard is out. They come in sizes from a sliver
; to a long blade (scale). The deeper one sits, the less of it shows and the deeper its cut: the deepest reach the
; bottom of the muscle on most patients. The last is under the skin (buried): only its cut shows, spread to reach it.
; Glass leaves its cuts dirty: they're rinsed with saline before the iodine. Past uv.x 0.6 the site hangs off the arm.
wounds=[]
burns=[]
internal=[]
targets=[{"kind": "shard", "uv": [0.2, 0.25], "depth": 0.0, "anchor": 0.2, "yaw": 20.0, "scale": 1.0, "remove_with": "clamp", "embedded": true}, {"kind": "shard", "uv": [0.45, 0.75], "depth": 0.006, "anchor": 0.4, "yaw": 110.0, "scale": 0.7, "remove_with": "clamp", "embedded": true}, {"kind": "shard", "uv": [0.45, 0.25], "depth": 0.014, "anchor": 0.6, "yaw": -35.0, "scale": 1.0, "remove_with": "clamp", "embedded": true}, {"kind": "shard", "uv": [0.2, 0.75], "depth": 0.012, "anchor": 0.5, "yaw": 70.0, "scale": 1.3, "remove_with": "clamp", "embedded": true}, {"kind": "shard", "uv": [0.2, 0.5], "depth": 0.002, "anchor": 0.2, "yaw": -80.0, "scale": 0.5, "remove_with": "clamp", "embedded": true}, {"kind": "shard", "uv": [0.45, 0.5], "depth": 0.032, "anchor": 0.5, "yaw": 15.0, "scale": 0.8, "remove_with": "clamp", "embedded": true}]

[objectives]

steps=[
	{"type": "sedate", "label": "Calm the patient with a sedative, keep them awake", "max_panic": 0.4},
	{"type": "local_block", "label": "Numb the arm", "level": 0.5, "after": ["sedate"]},
	{"type": "extract", "label": "Pull out every shard", "target": "shard", "after": ["local_block"]},
	{"type": "irrigate", "label": "Rinse each cut with saline", "after": ["extract"]},
	{"type": "sanitize", "label": "Paint the arm with iodine", "amount": 0.5, "after": ["irrigate"]},
	{"type": "close", "label": "Stitch the cuts", "after": ["sanitize"]},
	{"type": "stop_bleeding", "label": "Control the bleeding", "max_ml_s": 0.2}
]
