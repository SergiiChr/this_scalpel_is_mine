; Scenario definition. Format reference: docs/DESIGN.md#scenarios

[scenario]

order=10
title="Bullet Wound: Stomach"
difficulty=3
group="Gunshot 2/3"
description="The slug went through the stomach wall and stayed."
complaint="Gunshot wound, upper abdomen. No exit wound. Abdomen tender and rigid."
hidden=false
; Disabled until tests/scenarios/test_scenario_flows.gd::test_bullet_stomach passes.
disabled=true
time_limit=1200
anesthesia="general"
site="abdomen"
side="front"
start_orientation=0
patient_age="adult"
environment="or"
nurse=true
dirty_start=false
patient_quirks_min=1
patient_quirks_max=3
patient_quirk_pool=[]
fixed_patient_quirks=[]
starting_tools=["scalpel", "forceps", "needle", "gauze", "suction", "kidney_dish", "hemostat", "retractor", "cautery", "iv_catheter", "vial_propofol", "vial_cefazolin", "blood_o_neg"]
random_tools=["skin_stapler", "vial_txa", "vial_morphine", "gas_mask"]
random_tool_count=2
missing_tool_chance=0.15
events=[]
scripted_events=[]
start_vitals={}
preop={"iv": true}

[patient]

wounds=[{"kind": "gunshot", "points": [[0.55, 0.4], [0.56, 0.41]], "depth": 0.9}]
burns=[]
internal=[{"uv": [0.58, 0.44], "depth": 0.06, "size": 0.02}]
targets=[{"kind": "bullet", "uv": [0.6, 0.45], "depth": 0.07, "anchor": 0.0, "remove_with": "clamp", "covered": true}]

[objectives]

steps=[
	{"type": "anesthesia", "label": "Put the patient under", "level": 0.7},
	{"type": "incise", "label": "Open the abdomen", "length": 0.12},
	{"type": "extract", "label": "Find and remove the bullet", "target": "bullet"},
	{"type": "close_internal", "label": "Repair the stomach wall"},
	{"type": "inject", "label": "Give an antibiotic", "flag": "antibiotic"},
	{"type": "close", "label": "Close the abdomen"}
]
