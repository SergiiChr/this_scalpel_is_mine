; Scenario definition. Format reference: docs/DATA.md#scenarios

[scenario]

order=3
title="Appendectomy"
difficulty=2
group="Abdominal"
description="Textbook appendicitis. The kind of case they teach first."
complaint="Pain started around the navel, moved to the lower right abdomen. Fever, vomiting since last night."
hidden=false
time_limit=0
anesthesia="general"
site="abdomen"
side="front"
start_orientation=0
patient_age="adult"
environment="or"
nurse=true
dirty_start=false
patient_quirks_min=1
patient_quirks_max=2
patient_quirk_pool=[]
fixed_patient_quirks=[]
starting_tools=["scalpel", "forceps", "needle", "gauze", "suction", "kidney_dish", "hemostat", "retractor", "cautery", "marker", "iv_catheter", "vial_propofol", "saline_bag", "vial_cefazolin"]
random_tools=["skin_stapler", "vial_morphine", "gas_mask", "vial_txa"]
random_tool_count=2
missing_tool_chance=0.1
events=["patient_talk"]
scripted_events=[]
start_vitals={}
preop={}

[patient]

wounds=[]
burns=[]
internal=[]
targets=[{"kind": "appendix", "uv": [0.35, 0.62], "depth": 0.05, "anchor": 1.0, "remove_with": "clamp"}]

[objectives]

steps=[
	{"type": "iv", "label": "Set up an IV line"},
	{"type": "anesthesia", "label": "Put the patient under general anesthesia"},
	{"type": "sanitize", "label": "Sanitize the abdomen with iodine", "amount": 0.6},
	{"type": "mark", "label": "Mark the incision on the lower right abdomen", "length": 0.1, "optional": true},
	{"type": "xray", "label": "Find the appendix on an X-ray", "target": "appendix", "optional": true, "hint": true},
	{"type": "incise", "label": "Open the abdomen on the lower right", "length": 0.12, "after": ["anesthesia", "sanitize"]},
	{"type": "extract", "label": "Cut the appendix free at its base and lift it out", "target": "appendix"},
	{"type": "stop_bleeding", "label": "Stop the bleeding", "max_ml_s": 0.3},
	{"type": "close", "label": "Stitch the incision closed"}
]
