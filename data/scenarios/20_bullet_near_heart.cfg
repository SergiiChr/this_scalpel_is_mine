; Scenario definition. Format reference: docs/DESIGN.md#scenarios

[scenario]

order=20
title="Bullet Wound: Chest"
difficulty=5
group="Gunshot 3/3"
description="The bullet sits a finger's width from the heart."
complaint="Gunshot wound, chest. Bullet retained next to the heart on imaging."
; Disabled until tests/visual_confirmation/test_tissue_keyframes.gd::test_close_up_progressive_depth_keyframes passes.
hidden=true
time_limit=1500
anesthesia="general"
site="chest"
side="front"
start_orientation=0
patient_age="adult"
environment="or"
nurse=true
dirty_start=false
patient_quirks_min=2
patient_quirks_max=3
patient_quirk_pool=[]
fixed_patient_quirks=[]
starting_tools=["scalpel", "forceps", "needle", "gauze", "suction", "kidney_dish", "hemostat", "retractor", "cautery", "bone_saw", "defibrillator", "vial_adrenaline", "iv_catheter", "vial_propofol", "blood_o_neg", "blood_o_neg"]
random_tools=["heavy_saw", "vial_amiodarone", "vial_txa", "skin_stapler"]
random_tool_count=2
missing_tool_chance=0.1
events=["bleed_spike", "arrest", "wake_up"]
scripted_events=[]
start_vitals={}
preop={"iv": true}

[patient]

wounds=[{"kind": "gunshot", "points": [[0.42, 0.45], [0.43, 0.46]], "depth": 0.9}]
burns=[]
internal=[]
targets=[{"kind": "sternum", "uv": [0.5, 0.5], "depth": 0.01, "anchor": 1.0, "remove_with": "saw"}, {"kind": "bullet", "uv": [0.45, 0.5], "depth": 0.08, "anchor": 0.0, "remove_with": "clamp", "covered": true, "surge": 2.0}]

[objectives]

steps=[
	{"type": "anesthesia", "label": "Put the patient under", "level": 0.7},
	{"type": "incise", "label": "Open the chest", "length": 0.15},
	{"type": "extract", "label": "Saw through the sternum", "target": "sternum"},
	{"type": "extract", "label": "Remove the bullet", "target": "bullet"},
	{"type": "stop_bleeding", "label": "Control the bleeding", "max_ml_s": 0.3},
	{"type": "close", "label": "Close the chest", "amount": 0.85}
]
