; Scenario definition. Format reference: docs/DESIGN.md#scenarios

[scenario]

order=7
title="Open Fracture"
difficulty=3
group="Orthopedic 1/3"
description="Forearm bone through the skin. One of you pulls traction, the other lines up the ends. Neither of you lets go."
hidden=false
time_limit=1200
anesthesia="general"
site="forearm"
side="front"
start_orientation=0
patient_age="adult"
environment="or"
nurse=true
dirty_start=false
patient_quirks_min=1
patient_quirks_max=2
patient_quirk_pool=[]
fixed_patient_quirks=[]
starting_tools=["scalpel", "forceps", "needle", "gauze", "iodine_swab", "suction", "kidney_dish", "hemostat", "iv_catheter", "syringe_propofol", "syringe_cefazolin", "saline_bag"]
random_tools=["skin_stapler", "syringe_morphine", "cautery"]
random_tool_count=1
missing_tool_chance=0.1
events=["bleed_spike", "wake_up", "seizure"]
scripted_events=[]
start_vitals={}
preop={"iv": true}

[patient]

wounds=[{"kind": "tear", "points": [[0.4, 0.5], [0.6, 0.5]], "depth": 0.8, "opened": 0.6}]
burns=[]
internal=[]
targets=[{"kind": "fragment", "uv": [0.45, 0.5], "depth": 0.02, "offset": [0.03, 0.02], "remove_with": "clamp"}, {"kind": "fragment", "uv": [0.55, 0.5], "depth": 0.02, "offset": [-0.02, -0.03], "remove_with": "clamp"}]

[objectives]

steps=[
	{"type": "anesthesia", "label": "Put the patient under", "level": 0.7},
	{"type": "sanitize", "label": "Clean the exposed wound", "amount": 0.5},
	{"type": "inject", "label": "Give an antibiotic", "flag": "antibiotic"},
	{"type": "align", "label": "Hold both bone ends aligned (two surgeons)", "seconds": 6},
	{"type": "close", "label": "Close the wound", "amount": 0.85}
]
