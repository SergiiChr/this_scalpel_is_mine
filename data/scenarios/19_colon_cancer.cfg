; Scenario definition. Format reference: docs/DATA.md#scenarios

[scenario]

order=19
title="Colon Resection"
difficulty=4
group="Oncology 1/2"
description="A tumor in the colon. All of it has to come out, and nothing else."
complaint="Colon tumor found on screening. Weight loss, blood in stool for months."
hidden=false
time_limit=1500
anesthesia="general"
site="abdomen"
side="front"
start_orientation=0
patient_age="adult"
environment="or"
nurse=true
dirty_start=false
patient_quirks_min=2
patient_quirks_max=3
patient_quirk_pool=[]
fixed_patient_quirks=[]
starting_tools=["scalpel", "forceps", "needle", "gauze", "suction", "kidney_dish", "hemostat", "retractor", "cautery", "marker", "iv_catheter", "vial_propofol", "vial_cefazolin", "blood_o_neg"]
random_tools=["skin_stapler", "vial_txa", "gas_mask", "vial_morphine"]
random_tool_count=2
missing_tool_chance=0.1
events=["patient_talk"]
scripted_events=[]
start_vitals={}
preop={"iv": true}

[patient]

wounds=[]
burns=[]
internal=[]
targets=[{"kind": "tumor", "uv": [0.4, 0.55], "depth": 0.06, "anchor": 1.4, "remove_with": "clamp", "covered": true}]

[objectives]

steps=[
	{"type": "anesthesia", "label": "Put the patient under general anesthesia"},
	{"type": "sanitize", "label": "Sanitize the abdomen with iodine", "amount": 0.6},
	{"type": "xray", "label": "Find the tumor on an X-ray", "target": "tumor", "optional": true, "hint": true},
	{"type": "incise", "label": "Open the abdomen", "length": 0.15, "after": ["anesthesia", "sanitize"]},
	{"type": "extract", "label": "Cut the tumor free and lift it out", "target": "tumor"},
	{"type": "close_internal", "label": "Stitch the colon back together"},
	{"type": "stop_bleeding", "label": "Stop the bleeding", "max_ml_s": 0.3},
	{"type": "close", "label": "Stitch the abdomen closed"}
]
