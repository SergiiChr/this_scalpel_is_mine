; Scenario definition. Format reference: docs/DESIGN.md#scenarios

[scenario]

order=19
title="Colon Resection"
difficulty=4
group="Oncology 1/2"
description="A tumor in the colon. All of it has to come out, and nothing else."
complaint="Colon tumor found on screening. Weight loss, blood in stool for months."
hidden=false
time_limit=1500
anesthesia="general"
site="abdomen"
side="front"
start_orientation=0
patient_age="adult"
environment="or"
nurse=true
dirty_start=false
patient_quirks_min=2
patient_quirks_max=3
patient_quirk_pool=[]
fixed_patient_quirks=[]
starting_tools=["scalpel", "forceps", "needle", "gauze", "suction", "kidney_dish", "hemostat", "retractor", "cautery", "marker", "iv_catheter", "syringe_propofol", "syringe_cefazolin", "blood_o_neg"]
random_tools=["skin_stapler", "syringe_txa", "gas_mask", "syringe_morphine"]
random_tool_count=2
missing_tool_chance=0.1
events=["bleed_spike", "wake_up", "arrest", "patient_talk"]
scripted_events=[]
start_vitals={}
preop={"iv": true}

[patient]

wounds=[]
burns=[]
internal=[]
targets=[{"kind": "tumor", "uv": [0.4, 0.55], "depth": 0.06, "anchor": 1.4, "remove_with": "clamp", "covered": true}]

[objectives]

steps=[
	{"type": "anesthesia", "label": "Put the patient under", "level": 0.7},
	{"type": "sanitize", "label": "Sanitize the abdomen", "amount": 0.6},
	{"type": "incise", "label": "Open the abdomen", "length": 0.15},
	{"type": "extract", "label": "Cut around and remove the tumor", "target": "tumor"},
	{"type": "close_internal", "label": "Rejoin the colon"},
	{"type": "stop_bleeding", "label": "Control the bleeding", "max_ml_s": 0.3},
	{"type": "close", "label": "Close the abdomen", "amount": 0.85}
]
