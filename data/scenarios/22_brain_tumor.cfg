; Scenario definition. Format reference: docs/DESIGN.md#scenarios

[scenario]

order=22
title="Brain Tumor"
difficulty=5
group="Oncology 2/2"
description="A tumor in the brain, right next to the parts that make them who they are."
complaint="Seizures and headaches, a mass on the scan. Needs to answer questions during the operation."
; Disabled until tests/visual_confirmation/test_tissue_keyframes.gd::test_close_up_progressive_depth_keyframes passes.
hidden=true
time_limit=1800
anesthesia="general"
site="head"
side="front"
start_orientation=0
patient_age="adult"
environment="or"
nurse=true
dirty_start=false
patient_quirks_min=2
patient_quirks_max=3
patient_quirk_pool=[]
fixed_patient_quirks=[]
starting_tools=["scalpel", "forceps", "needle", "gauze", "suction", "kidney_dish", "hemostat", "cautery", "bone_saw", "marker", "iv_catheter", "vial_propofol", "vial_diazepam", "vial_lidocaine"]
random_tools=["heavy_saw", "mallet", "vial_txa", "skin_stapler"]
random_tool_count=2
missing_tool_chance=0.1
events=["seizure", "bleed_spike", "patient_talk", "arrest"]
scripted_events=[{"at": 420, "id": "wake_up"}]
start_vitals={}
preop={"iv": true}

[patient]

wounds=[]
burns=[]
internal=[]
targets=[{"kind": "skull_flap", "uv": [0.5, 0.5], "depth": 0.006, "anchor": 1.0, "remove_with": "saw"}, {"kind": "tumor", "uv": [0.52, 0.48], "depth": 0.05, "anchor": 1.2, "remove_with": "clamp"}]

[objectives]

steps=[
	{"type": "anesthesia", "label": "Put the patient under", "level": 0.7},
	{"type": "mark", "label": "Mark the skull flap", "length": 0.1},
	{"type": "incise", "label": "Open the scalp", "length": 0.1},
	{"type": "extract", "label": "Saw open the skull", "target": "skull_flap"},
	{"type": "extract", "label": "Remove the tumor", "target": "tumor"},
	{"type": "stop_bleeding", "label": "Control the bleeding", "max_ml_s": 0.2},
	{"type": "close", "label": "Close the scalp", "amount": 0.9}
]
