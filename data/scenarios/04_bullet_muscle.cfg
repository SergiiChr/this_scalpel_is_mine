; Scenario definition. Format reference: docs/DESIGN.md#scenarios

[scenario]

order=4
title="Bullet Wound: Thigh"
difficulty=2
group="Gunshot 1/3"
description="Through-and-not-quite-through. There's a slug somewhere in the thigh."
complaint="Single gunshot wound, right thigh. No exit wound found. Steady bleeding."
hidden=false
time_limit=0
anesthesia="general"
site="thigh"
side="front"
start_orientation=0
patient_age="adult"
environment="or"
nurse=true
dirty_start=false
patient_quirks_min=1
patient_quirks_max=2
patient_quirk_pool=[]
fixed_patient_quirks=[]
starting_tools=["scalpel", "forceps", "needle", "gauze", "iodine_swab", "suction", "kidney_dish", "hemostat", "retractor", "cautery", "tourniquet", "iv_catheter", "syringe_ketamine", "blood_o_neg"]
random_tools=["skin_stapler", "syringe_txa", "syringe_morphine"]
random_tool_count=1
missing_tool_chance=0.15
events=["bleed_spike", "wake_up", "arrest"]
scripted_events=[]
start_vitals={}
preop={"iv": true}

[patient]

wounds=[{"kind": "gunshot", "points": [[0.5, 0.5], [0.52, 0.51]], "depth": 0.9}]
burns=[]
internal=[]
targets=[{"kind": "bullet", "uv": [0.54, 0.5], "depth": 0.05, "anchor": 0.0, "remove_with": "clamp"}]

[objectives]

steps=[
	{"type": "anesthesia", "label": "Put the patient under", "level": 0.7},
	{"type": "incise", "label": "Widen the entry wound", "length": 0.05},
	{"type": "extract", "label": "Remove the bullet", "target": "bullet"},
	{"type": "stop_bleeding", "label": "Control the bleeding", "max_ml_s": 0.3},
	{"type": "close", "label": "Close the wound", "amount": 0.85}
]
