; Scenario definition. Format reference: docs/DESIGN.md#scenarios

[scenario]

order=15
title="Nose Job"
difficulty=2
group="Cosmetic"
description="Client wants 'the nose from the magazine'. You have a mallet and a photocopy."
complaint="Elective. Brought a photo of the nose they want."
hidden=false
; Disabled until tests/scenarios/test_scenario_flows.gd::test_nose_job passes.
disabled=true
time_limit=0
anesthesia="general"
site="face"
side="front"
start_orientation=0
patient_age="adult"
environment="or"
nurse=true
dirty_start=false
patient_quirks_min=1
patient_quirks_max=2
patient_quirk_pool=[]
fixed_patient_quirks=[]
starting_tools=["scalpel", "forceps", "marker", "mallet", "needle", "gauze", "iv_catheter", "vial_propofol", "kidney_dish"]
random_tools=["screwdriver", "surgical_tape", "vial_txa"]
random_tool_count=1
missing_tool_chance=0.1
events=["patient_talk"]
scripted_events=[]
start_vitals={}
preop={}

[patient]

wounds=[]
burns=[]
internal=[]
targets=[{"kind": "nasal_hump", "uv": [0.74, 0.5], "depth": 0.002, "anchor": 1.0, "remove_with": "smash"}]

[objectives]

steps=[
	{"type": "iv", "label": "Set up an IV line"},
	{"type": "anesthesia", "label": "Put the patient under", "level": 0.7},
	{"type": "mark", "label": "Mark the new shape", "length": 0.06},
	{"type": "incise", "label": "Open along the marks", "length": 0.05},
	{"type": "extract", "label": "Take down the hump", "target": "nasal_hump"},
	{"type": "close", "label": "Close up", "amount": 0.9}
]
