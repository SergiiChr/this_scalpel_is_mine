; Scenario definition. Format reference: docs/DESIGN.md#scenarios

[scenario]

order=17
title="Blocked Artery"
difficulty=4
group="Vascular"
description="A clot is choking the femoral artery. The leg below it is running out of time."
complaint="Sudden pain and cold in the right leg. No pulse below the groin."
; Disabled until tests/visual_confirmation/test_tissue_keyframes.gd::test_close_up_progressive_depth_keyframes passes.
hidden=true
time_limit=1200
anesthesia="general"
site="thigh"
side="front"
start_orientation=0
patient_age="adult"
environment="or"
nurse=true
dirty_start=false
patient_quirks_min=2
patient_quirks_max=3
patient_quirk_pool=[]
fixed_patient_quirks=[]
starting_tools=["scalpel", "forceps", "needle", "gauze", "suction", "kidney_dish", "hemostat", "hemostat", "retractor", "iv_catheter", "vial_propofol", "vial_heparin", "blood_o_neg"]
random_tools=["cautery", "vial_txa", "vial_amiodarone"]
random_tool_count=1
missing_tool_chance=0.1
events=["bleed_spike", "arrest", "wake_up"]
scripted_events=[]
start_vitals={}
preop={"iv": true}

[patient]

wounds=[]
burns=[]
internal=[{"uv": [0.5, 0.5], "depth": 0.04, "size": 0.025}]
targets=[{"kind": "clot", "uv": [0.5, 0.5], "depth": 0.04, "anchor": 1.0, "remove_with": "clamp", "surge": 4.0}]

[objectives]

steps=[
	{"type": "anesthesia", "label": "Put the patient under", "level": 0.7},
	{"type": "inject", "label": "Give heparin before clamping", "drug": "heparin"},
	{"type": "incise", "label": "Expose the artery", "length": 0.1},
	{"type": "clamp", "label": "Clamp the artery"},
	{"type": "extract", "label": "Remove the clot", "target": "clot"},
	{"type": "close_internal", "label": "Sew the artery closed"},
	{"type": "close", "label": "Close the skin", "amount": 0.85}
]
