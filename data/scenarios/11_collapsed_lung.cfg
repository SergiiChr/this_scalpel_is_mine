; Scenario definition. Format reference: docs/DESIGN.md#scenarios

[scenario]

order=11
title="Collapsed Lung"
difficulty=3
group="Thoracic 1/2"
description="Air where air shouldn't be. Oxygen is dropping. Decompress, drain, keep them breathing."
hidden=false
time_limit=900
anesthesia="local"
site="chest"
side="front"
start_orientation=0
patient_age="adult"
environment="or"
nurse=true
dirty_start=false
patient_quirks_min=1
patient_quirks_max=2
patient_quirk_pool=[]
fixed_patient_quirks=[]
starting_tools=["scalpel", "forceps", "suction", "gauze", "iodine_swab", "syringe_lidocaine", "needle", "iv_catheter", "saline_bag", "kidney_dish"]
random_tools=["syringe_morphine", "skin_stapler", "marker"]
random_tool_count=1
missing_tool_chance=0.1
events=["panic_flail", "patient_talk", "arrest"]
scripted_events=[]
start_vitals={"spo2": 82.0, "heart_rate": 118.0}
preop={}

[patient]

wounds=[]
burns=[]
internal=[]
targets=[{"kind": "air", "uv": [0.35, 0.4], "depth": 0.03, "anchor": 0.0, "remove_with": "suction", "amount": 6.0}]

[objectives]

steps=[
	{"type": "sanitize", "label": "Sanitize the chest", "amount": 0.5},
	{"type": "local_block", "label": "Numb the site", "level": 0.5},
	{"type": "incise", "label": "Small cut between the ribs", "length": 0.03},
	{"type": "extract", "label": "Decompress with suction", "target": "air"},
	{"type": "close", "label": "Close the cut", "amount": 0.8},
	{"type": "stabilize", "label": "Oxygen back above 94", "seconds": 20}
]
