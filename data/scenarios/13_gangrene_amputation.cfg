; Scenario definition. Format reference: docs/DESIGN.md#scenarios

[scenario]

order=13
title="Gangrene Amputation"
difficulty=3
group="Orthopedic 2/3"
description="The lower leg is gone, it just hasn't left yet."
complaint="Diabetic, ignored a foot wound for a month. Lower leg black and cold, smells. Fever."
hidden=false
; Disabled until tests/Scenarios/ScenarioFlowsTest.cs PlaysThroughKnownBroken("gangrene_amputation") passes.
disabled=true
time_limit=1200
anesthesia="general"
site="lower_leg"
side="front"
start_orientation=0
patient_age="adult"
environment="or"
nurse=true
dirty_start=false
patient_quirks_min=1
patient_quirks_max=3
patient_quirk_pool=[]
fixed_patient_quirks=[]
starting_tools=["scalpel", "forceps", "needle", "gauze", "suction", "kidney_dish", "tourniquet", "bone_saw", "cautery", "hemostat", "iv_catheter", "vial_propofol", "blood_o_neg", "vial_cefazolin"]
random_tools=["heavy_saw", "mallet", "skin_stapler", "vial_txa"]
random_tool_count=2
missing_tool_chance=0.1
events=[]
scripted_events=[]
start_vitals={}
preop={"iv": true}

[patient]

wounds=[]
burns=[]
internal=[]
targets=[{"kind": "bone", "uv": [0.5, 0.5], "depth": 0.03, "anchor": 1.0, "remove_with": "saw"}]

[objectives]

steps=[
	{"type": "anesthesia", "label": "Put the patient under", "level": 0.7},
	{"type": "tourniquet", "label": "Apply a tourniquet above the cut"},
	{"type": "mark", "label": "Mark the amputation line", "length": 0.15, "optional": true},
	{"type": "incise", "label": "Cut around the limb", "length": 0.2},
	{"type": "extract", "label": "Saw through the bone", "target": "bone"},
	{"type": "stop_bleeding", "label": "Seal the vessels", "max_ml_s": 0.3},
	{"type": "close", "label": "Close the stump"}
]
