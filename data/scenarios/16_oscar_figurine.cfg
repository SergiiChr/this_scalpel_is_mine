; Scenario definition. Format reference: docs/DESIGN.md#scenarios

[scenario]

order=16
title="Best Supporting Object"
difficulty=3
group="Abdominal"
description="An award-shaped object is lodged in the large intestine. Nobody wants to talk about how."
complaint="Foreign object in the large intestine, visible on a previous X-ray. Patient declines to explain."
hidden=false
; Disabled until tests/scenarios/test_scenario_flows.gd::test_oscar_figurine passes.
disabled=true
time_limit=1200
anesthesia="general"
site="abdomen"
side="front"
start_orientation=0
patient_age="adult"
environment="or"
nurse=true
dirty_start=false
patient_quirks_min=1
patient_quirks_max=3
patient_quirk_pool=[]
fixed_patient_quirks=[]
starting_tools=["scalpel", "forceps", "needle", "gauze", "suction", "kidney_dish", "hemostat", "retractor", "cautery", "iv_catheter", "vial_propofol", "vial_cefazolin"]
random_tools=["skin_stapler", "vial_morphine", "gas_mask"]
random_tool_count=2
missing_tool_chance=0.1
events=["patient_talk"]
scripted_events=[]
start_vitals={}
preop={"iv": true}

[patient]

wounds=[]
burns=[]
internal=[]
targets=[{"kind": "figurine", "uv": [0.45, 0.6], "depth": 0.07, "anchor": 1.0, "remove_with": "clamp", "covered": true}]

[objectives]

steps=[
	{"type": "anesthesia", "label": "Put the patient under", "level": 0.7},
	{"type": "sanitize", "label": "Sanitize the abdomen", "amount": 0.6},
	{"type": "incise", "label": "Open the abdomen", "length": 0.14},
	{"type": "extract", "label": "Open the bowel and extract the object", "target": "figurine"},
	{"type": "close_internal", "label": "Close the bowel"},
	{"type": "close", "label": "Close the abdomen", "amount": 0.85}
]
