; Scenario definition. Format reference: docs/DESIGN.md#scenarios

[scenario]

order=14
title="Burn Treatment"
difficulty=3
group="Burns"
description="Large burn across the chest. It will get infected if nobody deals with it."
complaint="Kitchen fire. Full thickness burn across the chest, dead white and leathery in the middle."
hidden=false
time_limit=1200
anesthesia="general"
site="chest"
side="front"
start_orientation=0
patient_age="adult"
environment="or"
nurse=true
dirty_start=false
patient_quirks_min=1
patient_quirks_max=2
patient_quirk_pool=[]
fixed_patient_quirks=[]
starting_tools=["scalpel", "forceps", "gauze", "skin_graft", "iv_catheter", "vial_propofol", "saline_bag", "vial_cefazolin", "kidney_dish"]
random_tools=["skin_graft", "vial_morphine", "suction"]
random_tool_count=1
missing_tool_chance=0.0
events=[]
scripted_events=[]
start_vitals={}
preop={"iv": true}

[patient]

wounds=[]
burns=[{"uv": [0.4, 0.45], "radius": 0.18}, {"uv": [0.62, 0.55], "radius": 0.14}]
internal=[]
targets=[]

[objectives]

steps=[
	{"type": "anesthesia", "label": "Put the patient under general anesthesia"},
	{"type": "sanitize", "label": "Clean the burns with iodine", "amount": 0.6},
	{"type": "debride", "label": "Cut away the dead burned skin", "amount": 0.5, "after": ["anesthesia"]},
	{"type": "graft", "label": "Cover the cleaned burns with skin grafts", "amount": 0.7, "after": ["debride"]},
	{"type": "inject", "label": "Give an antibiotic against infection", "flag": "antibiotic"}
]
