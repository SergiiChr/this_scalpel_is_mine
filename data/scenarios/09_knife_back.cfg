; Scenario definition. Format reference: docs/DESIGN.md#scenarios

[scenario]

order=9
title="Knife in the Back"
difficulty=3
group="Trauma 2/2"
description="Brought in on their side with a kitchen knife between the shoulder blades."
complaint="Stab wound, upper back. Knife still in place. Arrived lying on their side."
hidden=false
time_limit=1200
anesthesia="general"
site="back"
side="back"
start_orientation=1
patient_age="adult"
environment="or"
nurse=true
dirty_start=false
patient_quirks_min=1
patient_quirks_max=2
patient_quirk_pool=[]
fixed_patient_quirks=[]
starting_tools=["scalpel", "forceps", "needle", "gauze", "suction", "kidney_dish", "hemostat", "cautery", "iv_catheter", "vial_propofol", "blood_o_neg", "saline_bag"]
random_tools=["retractor", "skin_stapler", "vial_txa"]
random_tool_count=2
missing_tool_chance=0.1
events=["wake_up", "arrest"]
scripted_events=[]
start_vitals={}
preop={"iv": true}

[patient]

wounds=[{"kind": "puncture", "points": [[0.49, 0.5], [0.51, 0.5]], "depth": 0.9, "held": 0.9}]
burns=[]
internal=[]
targets=[{"kind": "knife", "uv": [0.5, 0.5], "depth": 0.0, "anchor": 0.4, "remove_with": "clamp", "surge": 3.0}]

[objectives]

steps=[
	{"type": "anesthesia", "label": "Put the patient under", "level": 0.7},
	{"type": "flip", "label": "Turn the patient face down", "orientation": 2},
	{"type": "extract", "label": "Pull the knife out (have clamps ready)", "target": "knife"},
	{"type": "stop_bleeding", "label": "Control the bleeding", "max_ml_s": 0.3},
	{"type": "close", "label": "Close the wound", "amount": 0.85}
]
