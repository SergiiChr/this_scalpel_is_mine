; Scenario definition. Format reference: docs/DESIGN.md#scenarios

[scenario]

order=21
title="Leg Extension"
difficulty=4
group="Orthopedic 3/3"
description="Elective. They want to be taller, and they paid in advance."
complaint="Elective leg lengthening. Healthy. Signed every waiver twice."
hidden=false
; Disabled until tests/scenarios/test_scenario_flows.gd::test_leg_extension passes.
disabled=true
time_limit=1500
anesthesia="general"
site="thigh"
side="front"
start_orientation=0
patient_age="adult"
environment="or"
nurse=true
dirty_start=false
patient_quirks_min=2
patient_quirks_max=3
patient_quirk_pool=[]
fixed_patient_quirks=[]
starting_tools=["scalpel", "forceps", "needle", "gauze", "suction", "kidney_dish", "bone_saw", "mallet", "screwdriver", "hemostat", "retractor", "iv_catheter", "vial_propofol", "blood_o_neg"]
random_tools=["heavy_saw", "cautery", "vial_txa"]
random_tool_count=1
missing_tool_chance=0.1
events=[]
scripted_events=[]
start_vitals={}
preop={"iv": true}

[patient]

wounds=[]
burns=[]
internal=[]
targets=[{"kind": "bone", "uv": [0.5, 0.5], "depth": 0.04, "anchor": 1.0, "remove_with": "saw"}, {"kind": "fragment", "uv": [0.45, 0.5], "depth": 0.04, "offset": [0.0, 0.02], "remove_with": "clamp"}, {"kind": "fragment", "uv": [0.55, 0.5], "depth": 0.04, "offset": [0.0, -0.02], "remove_with": "clamp"}]

[objectives]

steps=[
	{"type": "anesthesia", "label": "Put the patient under", "level": 0.7},
	{"type": "incise", "label": "Expose the femur", "length": 0.15},
	{"type": "extract", "label": "Cut the bone", "target": "bone"},
	{"type": "align", "label": "Hold the ends apart and aligned", "seconds": 8},
	{"type": "stop_bleeding", "label": "Control the bleeding", "max_ml_s": 0.3},
	{"type": "close", "label": "Close the leg", "amount": 0.85}
]
