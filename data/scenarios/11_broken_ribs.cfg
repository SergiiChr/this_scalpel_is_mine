; Scenario definition. Format reference: docs/DESIGN.md#scenarios
; A broken rib has speared the lung: set the rib, pull the splinter, let the trapped air out.

[scenario]

order=11
title="Broken Ribs, Collapsed Lung"
difficulty=4
group="Thoracic 1/2"
description="Fell off a ladder onto a railing. Every breath sounds worse than the last."
complaint="Fall from a ladder onto a railing. Chest wall tender, one side not moving with breathing. Short of breath, oxygen falling."
hidden=false
; Disabled until tests/scenarios/test_scenario_flows.gd::test_broken_ribs passes.
disabled=true
time_limit=1080
anesthesia="local"
site="chest"
side="front"
start_orientation=0
patient_age="adult"
environment="or"
nurse=true
dirty_start=false
patient_quirks_min=1
patient_quirks_max=2
patient_quirk_pool=[]
fixed_patient_quirks=[]
starting_tools=["scalpel", "forceps", "hemostat", "suction", "gauze", "vial_lidocaine", "vial_morphine", "needle", "iv_catheter", "saline_bag", "kidney_dish"]
random_tools=["retractor", "skin_stapler", "marker", "cautery"]
random_tool_count=1
missing_tool_chance=0.1
events=["panic_flail", "patient_talk"]
scripted_events=[]
start_vitals={"spo2": 80.0, "heart_rate": 124.0}
preop={}

[patient]

; The railing bruised and split the skin over the break.
wounds=[{"kind": "tear", "points": [[0.44, 0.4], [0.5, 0.43], [0.56, 0.41]], "depth": 0.45}]
burns=[]
internal=[{"uv": [0.52, 0.5], "depth": 0.05}]
; Both ends of the broken rib, knocked out of line (rest uv is where they belong).
; The splinter broke off the rib and is stuck in the lung; it bleeds when it comes out.
targets=[{"kind": "rib", "uv": [0.5, 0.46], "depth": 0.025, "offset": [0.025, 0.018], "remove_with": "clamp"}, {"kind": "rib", "uv": [0.5, 0.46], "depth": 0.025, "offset": [-0.018, -0.022], "yaw": 180.0, "remove_with": "clamp"}, {"kind": "splinter", "uv": [0.53, 0.52], "depth": 0.045, "anchor": 0.4, "surge": 0.6, "remove_with": "clamp"}, {"kind": "air", "uv": [0.4, 0.58], "depth": 0.06, "anchor": 0.0, "remove_with": "suction", "amount": 6.0}]

[objectives]

steps=[
	{"type": "sanitize", "label": "Sanitize the chest", "amount": 0.5},
	{"type": "local_block", "label": "Numb the site", "level": 0.5},
	{"type": "incise", "label": "Open over the break", "length": 0.05},
	{"type": "align", "label": "Pull both rib ends back into line and hold them", "seconds": 5},
	{"type": "extract", "label": "Pull the bone splinter out of the lung", "target": "splinter"},
	{"type": "close_internal", "label": "Sew the hole in the lung"},
	{"type": "extract", "label": "Let the trapped air out with suction", "target": "air"},
	{"type": "close", "label": "Close the chest"},
	{"type": "stabilize", "label": "Oxygen back above 94", "seconds": 20}
]
