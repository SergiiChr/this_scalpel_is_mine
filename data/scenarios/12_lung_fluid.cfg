; Scenario definition. Format reference: docs/DESIGN.md#scenarios

[scenario]

order=12
title="Fluid on the Lung"
difficulty=3
group="Thoracic 2/2"
description="Fluid keeps pooling around the lung, and it keeps coming back."
complaint="Increasing breathlessness over a week. Dull to tap on one side of the chest."
hidden=false
time_limit=900
anesthesia="local"
site="chest"
side="front"
start_orientation=0
patient_age="adult"
environment="or"
nurse=true
dirty_start=false
patient_quirks_min=1
patient_quirks_max=2
patient_quirk_pool=[]
fixed_patient_quirks=[]
starting_tools=["scalpel", "forceps", "suction", "gauze", "iodine_swab", "syringe_lidocaine", "needle", "iv_catheter", "syringe_antihistamine", "kidney_dish"]
random_tools=["metal_straw", "skin_stapler", "syringe_diazepam"]
random_tool_count=1
missing_tool_chance=0.1
events=["panic_flail", "patient_talk", "cough"]
scripted_events=[]
start_vitals={"spo2": 86.0}
preop={}

[patient]

wounds=[]
burns=[]
internal=[]
targets=[{"kind": "fluid", "uv": [0.4, 0.62], "depth": 0.03, "anchor": 0.0, "remove_with": "suction", "amount": 10.0, "refill": 0.05}]

[objectives]

steps=[
	{"type": "sanitize", "label": "Sanitize the chest", "amount": 0.5},
	{"type": "local_block", "label": "Numb the site", "level": 0.5},
	{"type": "incise", "label": "Small drainage cut", "length": 0.03},
	{"type": "extract", "label": "Drain the fluid", "target": "fluid"},
	{"type": "close", "label": "Close the cut", "amount": 0.8}
]
