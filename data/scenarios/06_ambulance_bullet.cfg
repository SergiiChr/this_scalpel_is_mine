; Scenario definition. Format reference: docs/DESIGN.md#scenarios

[scenario]

order=6
title="Ambulance Run"
difficulty=3
group="Field 2/2"
description="Twelve minutes to the hospital, potholes all the way. No nurse, only what's in the van."
complaint="Gunshot wound, left shoulder. Bullet retained. In transit."
hidden=false
time_limit=720
anesthesia="general"
site="shoulder"
side="front"
start_orientation=0
patient_age="adult"
environment="ambulance"
nurse=false
dirty_start=false
patient_quirks_min=1
patient_quirks_max=2
patient_quirk_pool=[]
fixed_patient_quirks=[]
starting_tools=["scalpel", "forceps", "gauze", "needle", "skin_stapler", "vial_ketamine", "iv_catheter", "saline_bag", "suction", "kidney_dish"]
random_tools=["cautery", "hemostat", "blood_o_neg", "vial_adrenaline"]
random_tool_count=2
missing_tool_chance=0.2
events=["pothole"]
scripted_events=[]
start_vitals={}
preop={}

[patient]

wounds=[{"kind": "gunshot", "points": [[0.48, 0.5], [0.5, 0.5]], "depth": 0.9}]
burns=[]
internal=[]
targets=[{"kind": "bullet", "uv": [0.5, 0.55], "depth": 0.04, "anchor": 0.0, "remove_with": "clamp"}]

[objectives]

steps=[
	{"type": "iv", "label": "Set up an IV line"},
	{"type": "anesthesia", "label": "Sedate the patient", "level": 0.7},
	{"type": "extract", "label": "Remove the bullet", "target": "bullet"},
	{"type": "close", "label": "Close the wound", "amount": 0.8},
	{"type": "stabilize", "label": "Keep them stable until arrival", "seconds": 45}
]
