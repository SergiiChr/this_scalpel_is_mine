; Run modifiers. The host rolls 1-2 per run in the lobby, so everyone sees them before starting.
; effects uses the quirk syntax: key=value, `_mult` keys multiply, other numbers add.
;
; nurse_delay_mult / nurse_cooldown_mult   nurse fetch time and global cooldown
; blood_delay_mult                          extra fetch time for blood packs
; drug_strength_mult                        every drug's effect strength
; score_mult                                final score multiplier
; stress_mult                               stress gained by both surgeons
; missing_tool_chance                       added chance that a tray tool is missing
; flicker_weight                            extra weight for the lights flickering event
; cold                                      patient runs cold, surgeons' hands shake a little
; card_error                                the patient card has a wrong entry until the nurse brings the corrected one

[understaffed]
name="Understaffed night shift"
description="One nurse for three floors. Requests take twice as long."
effects="nurse_delay_mult=2, nurse_cooldown_mult=1.5"

[expired_drugs]
name="Expired stock"
description="Someone didn't check the dates. Every drug is 30% weaker."
effects="drug_strength_mult=0.7"

[power_trouble]
name="Bad wiring"
description="The generator coughs. Lights flicker far more often."
effects="flicker_weight=6"

[med_student]
name="Medical student watching"
description="An audience. Score counts 25% more, stress builds 40% faster."
effects="score_mult=1.25, stress_mult=1.4"

[short_supplies]
name="Short supplies"
description="Half the tray went missing in the last shift."
effects="missing_tool_chance=0.3"

[blood_shortage]
name="Blood shortage"
description="The blood bank is nearly dry. Blood packs take three times as long."
effects="blood_delay_mult=3"

[cold_room]
name="Broken heating"
description="The patient cools down and your fingers are stiff."
effects="cold=1"

[chart_error]
name="Chart mix-up"
description="Records got shuffled. The patient card has a wrong entry until the corrected chart arrives."
effects="card_error=1"
