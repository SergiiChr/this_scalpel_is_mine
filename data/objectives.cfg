; Subtasks the "I'm just a baby" difficulty lists under each objective step, by step type (an extract step by
; extract_<remove_with> of its target). A scenario step's own "subtasks" list replaces these. Each line says what to do
; and matches the manual's wording for it: change both together.
;
; Written like manual numbers, "{...}" is worked out for this patient when the surgery starts (Subtasks.cs):
; {get.X}      Pick up the tool or drug X, or order it from the nurse when the room has none. A drug the patient is
;              allergic to becomes its first alternative they can take, and a section's "allergy_instead" names the
;              section whose subtasks give that alternative.
; {dose.X}     The right dose of drug X for this patient's weight in ml of its vial, with the allergy note.
; {syringe.X}  The smallest syringe that holds that dose.
; X = step: the step's own "drug", else the section's "drug". X = blood: the blood pack this patient can take.
; {step.key}   The step's own numbers ("amount", "length"...), in an expression like {step.length * 100}.
; Anything else is a manual expression: {Patient.WakeSeconds}, {drug.lidocaine.Onset}.
; A line starting with {if.name} is listed only while that holds for the patient (Subtasks.Conditions): muscle_cut (a
; wound's muscle is still open), attached (a target of the step's kind is still attached), buried (one is still out of
; reach under the skin), no_iv (no working IV line), iv_in (a catheter in the arm), low_pressure, beating (the heart),
; arrested (it has stopped), flat_line.

[iv]
subtasks=["{get.iv_catheter}", "Hold it at the infusion stand and connect the giving set (Connect the IV line)", "Rest the tip on a forearm vein away from the site and lower it (Use tool) until it seats; zoom in to see the vein"]

[anesthesia]
drug="propofol"
subtasks=["{get.step}", "Draw {dose.step} into {syringe.step}: needle in the vial, wheel down pulls the plunger", "Push it into the IV bag on the stand, or straight into a vein (wheel up)", "Wait until the patient's eyes close and the monitor shows no breathing"]

[sedate]
drug="diazepam"
subtasks=["{get.step}", "Draw {dose.step} into {syringe.step}", "Inject it into the arm (needle in, wheel up)", "Wait for the patient to calm down; they must stay awake, so give nothing else that puts them under"]

[local_block]
drug="lidocaine"
; Allergic to lidocaine, the patient is put under instead, as the manual's first alternative says.
allergy_instead="anesthesia"
subtasks=["{get.step}", "Draw {dose.step} into {syringe.step}", "Push the needle into the skin beside the wound and inject all of it (wheel up)", "Wait a few seconds for the area to go numb"]

[sanitize]
subtasks=["Pour iodine from the bottle into the iodine dish (hold Use tool over the dish)", "Take a cotton pad with the forceps (Use tool on the pad) and soak it in the dish", "Wipe the site until it is stained orange-brown, at least {step.amount * 100}% of it; soak the pad again when it runs dry"]

[irrigate]
subtasks=["Fill a syringe with saline from the IV bag (needle in the bag, wheel down)", "Point the needle at a cut without pushing it in and squirt (wheel up), about {Patient.RinseMlPerCm} ml per cm of cut", "Rinse every cut until it runs clean"]

[mark]
subtasks=["{get.marker}", "Hold Use tool on the skin and draw a line at least {step.length * 100} cm long where you will cut"]

[incise]
subtasks=["{get.scalpel}", "Turn the blade with Rotate tool so its edge runs along the line", "Lower it (Use tool), set level 1 with the wheel and draw it slowly along the line; go over it again at levels 2 and 3", "Cut through the muscle (level 3) along at least {step.length * 100} cm", "Hold the edges apart with a retractor or a Gelpi retractor to see inside"]

[extract_clamp]
subtasks=["{get.forceps}", "Clear the blood with suction or gauze until you can see it", "Lower the forceps onto it and press Use tool to close them on it", "{if.attached}It's still attached: cut it free with the scalpel first", "Scroll the wheel up a notch at a time to draw it out slowly"]

[extract_suction]
subtasks=["{get.suction}", "Lower the suction tip into the opening, where the fluid or air is", "Set level 3 with the wheel and hold Use tool until it's all drained"]

[extract_saw]
subtasks=["{get.bone_saw}", "Set full speed with the wheel (level 3)", "Hold the saw on the bone (hold Use tool) until it's cut through; keep it off the skin"]

[extract_smash]
subtasks=["{get.mallet}", "Strike it (Use tool), one blow a press, until it comes loose"]

[close]
subtasks=["{get.needle}", "{if.muscle_cut}The muscle is cut: sew it first, from inside the wound", "Click (Use tool) beside the wound, zigzagging from one side to the other along its whole length", "Roll the wheel down to tighten the thread until the hand status reads Closed", "Hold Use tool to make the last hole and tie the thread off"]

[close_internal]
subtasks=["{get.needle}", "Reach into the opening and hold the needle on the internal injury (hold Use tool) until it's repaired"]

[stop_bleeding]
subtasks=["Clamp spurting vessels with a hemostat and cauterize small bleeding points", "Press gauze on what still oozes (Use tool); close the wound to stop it for good", "The monitor's bleeding rate must stay under {step.max_ml_s} ml/s without gauze"]

[stabilize]
subtasks=["Keep oxygen at {ObjectiveChecks.StableSpo2}% or more and systolic pressure at {ObjectiveChecks.StableSystolic} mmHg or more for {step.seconds} s", "{if.low_pressure}Pressure low after blood loss: hold a saline bag or a blood pack at the IV stand and swap it in (Swap IV bag)", "{if.arrested}Heart stopped: shock it with the defibrillator; on a flat line give adrenaline first (manual: Cardiac arrest)"]

[calm]
subtasks=["Stand at the head of the table and talk to the patient (Interact: Talk to the patient)", "Keep at it: their panic must stay low for {ObjectiveChecks.CalmSeconds} s"]

[inject]
; An antibiotic step names no drug: cefazolin, the manual's first choice.
drug="cefazolin"
subtasks=["{get.step}", "Draw {dose.step} into {syringe.step}", "Push it into the IV bag on the stand, or straight into a vein (wheel up)"]

[defib]
subtasks=["{get.defibrillator}", "{if.beating}Wait for the alarm: the heart has stopped", "Everyone else lets go of the patient", "Press the paddles on the chest, hold Use tool to charge ({ToolActions.DefibChargeTime} s) and let go to shock", "{if.flat_line}Flat line: give {dose.adrenaline} into the IV bag or a vein first, then shock within {Patient.RestartWindow} s"]

[tourniquet]
subtasks=["{get.tourniquet}", "Press it onto the limb above the wound (Use tool): it wraps around and tightens"]

[clamp]
subtasks=["{get.hemostat}", "Close it on the bleeding vessel (Use tool), then let go of it (Grab): it stays locked"]

[transfuse]
subtasks=["{if.no_iv}Set up an IV line first", "{get.blood}", "Hold it at the IV stand and swap it in (Swap IV bag)", "Swap in more packs until the patient has {step.min_ml} ml of blood again"]

[flip]
subtasks=["Let go of the patient and put down the tools", "Everyone stands on the same side of the table", "Interact with the table (Turn the patient) and press the keys as they show", "Turn one step at a time: onto the side first, then face down"]

[align]
subtasks=["Two surgeons each take forceps for one bone end; operating alone, take forceps in both hands", "Close the forceps on each bone end (Use tool)", "Move both ends back into line together and hold them still for {step.seconds} s"]

[debride]
subtasks=["{get.scalpel}", "Draw the blade over the burned skin at level 1, row by row", "Cut away at least {step.amount * 100}% of the burned skin"]

[graft]
subtasks=["{get.skin_graft}", "Press it onto the debrided burns (Use tool), one patch at a time", "Cover at least {step.amount * 100}% of the burns; order more grafts when it runs out"]

[xray]
subtasks=["Grab the X-ray unit and put it over the target area", "Take an image (Use tool)", "Review the images (Interact) once they develop"]

[wake]
; Not a step: the optional task listed before the discharge once the required steps count, while the patient is under
; (Objectives.WakeLabel).
subtasks=["{get.flumazenil}", "Draw {dose.flumazenil} into {syringe.flumazenil} and push it into the IV bag or a vein (wheel up)", "Wait until the patient wakes, within about {Patient.WakeSeconds} s"]

[remove_iv]
; Not a step: the optional cleanup listed before the discharge once the required steps count, while an IV is in or the
; hole it left is open (Objectives.RemoveIvLabel).
subtasks=["{if.iv_in}Interact with the dressing on the forearm (Remove the IV)", "{get.surgical_tape}", "Press it beside the hole, then on its other side to stick a strip across it (Use tool)"]

[listen]
subtasks=["Stay in the room after the injection for {step.seconds} s"]

[comfort]
subtasks=["Stand at the head of the table and talk to the patient (Interact: Talk to the patient)", "Stay with them for {step.seconds} s in all"]

[wait]
subtasks=["Wait {step.seconds} s"]
