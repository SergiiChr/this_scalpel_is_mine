; Post-surgery report. Each section is a rule checked against the patient's flags at the end.
; flag        Patient flag name (counters set during the operation, see Patient.AddFlag() calls).
; min         Rule fires when flag >= min.
; chance      Probability it happens (rolled once per run, from the session seed).
; text        Shown in the report. {site} is replaced with the operated body part.
; points      Score change.
; Rules are checked top to bottom. "stop" = true ends checking (one catastrophic outcome is enough).

[retained_tool]
flag="retained_tool"
min=1
chance=1.0
text="Follow-up X-ray found a surgical tool inside the patient. They are suing. Both of you. Personally."
points=-25
stop=false

