; Every grabbable item. Section name = tool id.
;
; action      What the tool does when used (see src/tools/tool_actions.gd):
;             cut, clamp, suture, cauterize, mark, inject, syringe, vial, shock, saw, smash, suction, swab, pour, tourniquet,
;             graft, iv_line, none
; sharpness   cut/saw strength. Lower = more tearing and bleeding.
; quality     How well it does its job. For closures: 1 = perfect, lower = weak seal, may burst.
; radius      Effect radius in meters (burn width, swab size, suction reach).
; power       Tool specific strength (clamp grip, burn heat, saw rate, shock joules / 100).
; sterile     Starts sterile. Improvised tools usually don't.
; size        fine, normal, heavy. Hand size quirks block fine or heavy tools.
; improvised  Scoring and report treat it as a backup tool.
; orderable   Nurse can fetch it. delay = fetch seconds. category = the group it's listed under in the nurse's menu.
; charges     Uses before empty (-1 = unlimited).
; drug        Drug id carried (vials, bags, bottles). See drugs.cfg.
; volume      Liquid it holds in ml: a syringe's barrel, a vial's contents when full.
; concentration  Drug per ml in a vial, in the drug's unit (drugs.cfg). Also part of the vial's name, its label.
; fragile     Breaks when it hits the floor.
; drinkable   Surgeon can drink from it (drink key).
; model       Model file in assets/models/tools/ when several tools share one (vials, bags). Defaults to the tool id.
; length      Grip to tip distance in meters. The generator builds the model to match (tools/assetgen/instruments.py).
; width       Collision thickness in meters.
; color       Tint for the model's "tint" parts (drug color, pen body, lighter).
; grip        How a hand holds it: pencil (default: between thumb and fingers), rings (fingers through the rings),
;             fist (wrapped around a handle), flat (pinched at the edge). See src/surgeon/surgeon_hand.gd.

