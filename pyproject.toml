# Tool settings only. Python dependencies live in requirements.txt and requirements-dev.txt (./build.py dev installs them).

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN"]

[tool.mypy]
strict = true
ignore_missing_imports = true
# trimesh, scipy and shapely ship without type hints.
disallow_untyped_calls = false
