# Key frames are artifacts for manual review, not automatic screenshot comparisons.
name: Visual capture

on:
  workflow_dispatch:

jobs:
  visuals:
    name: Capture visual regression key frames
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - uses: ./.github/actions/setup-godot
      - run: ./build.py test --tag visual_confirmation --with-key-frames --ci-run
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-results
          path: |
            build/test-logs
            build/test-results
            build/test-artifacts/screenshots
          if-no-files-found: warn
