# GUT scripts are the executable source of truth. Smoke gates full regression and export.
name: Tests

on:
  push:
  pull_request:

jobs:
  assetgen:
    name: Asset generator lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # bpy is left out: it's a large download and the lint and type checks don't need it.
      - run: pip install -r requirements.txt ruff==0.16.9 mypy==2.3.1
      - run: ruff check tools
      - run: ruff format --check tools
      - run: mypy tools

  game:
    name: GUT smoke, regression, visuals and export
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Godot and its export templates are large, keep them between runs.
      - uses: actions/cache@v4
        with:
          path: |
            .tools
            ~/.local/share/godot/export_templates
          key: godot-${{ hashFiles('build.sh') }}
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Fast headless smoke gate
        run: ./build.sh test
      - name: Full GUT regression
        run: ./build.sh test --all --jobs 2
      - run: SKIP_TESTS=1 ./build.sh build
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/test-logs
            build/test-results
            build/test-artifacts/screenshots
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: ThisScalpelIsMine-linux
          path: build/ThisScalpelIsMine.x86_64
