# The GdUnit4 suites under tests/ are the executable source of truth. Smoke gates full regression and export.
name: Tests

# Pushes to main only: a branch with a pull request is tested once, by the pull_request run.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint and types (C# analyzers, ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Analyzers run as part of the build and fail it on any warning.
      - run: dotnet build --nologo ThisScalpelIsMine.csproj
      # Exported games build without the tests: their code must not lean on anything only the tests bring.
      - run: dotnet build --nologo -c ExportRelease ThisScalpelIsMine.csproj
      - run: dotnet format ThisScalpelIsMine.csproj --verify-no-changes
      # bpy is left out: it's a large download and the lint and type checks don't need it.
      - run: pip install -r requirements.txt ruff==0.16.9 mypy==2.3.1
      - run: ruff check tools build.py
      - run: ruff format --check tools build.py
      - run: mypy tools build.py

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - run: ./build.py test --ci-run
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: |
            build/test-logs
            build/test-results
          if-no-files-found: warn

  regression:
    name: Regression, visuals and export
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - uses: ./.github/actions/setup-godot
      # One suite at a time: every GdUnit4 process rebuilds the project before it runs, and a rebuild beside another
      # suite's start leaves that suite without its runner class.
      - name: Everything else, with key frames
        run: ./build.py test --all --skip smoke --with-key-frames --ci-run
      # The smoke cases that take key frames, again with them on.
      - name: Smoke key frames
        run: ./build.py test --tag smoke --tag visual_confirmation --with-key-frames --ci-run
      - run: SKIP_TESTS=1 ./build.py build
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: |
            build/test-logs
            build/test-results
            build/test-artifacts/screenshots
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: ThisScalpelIsMine-linux
          path: build/ThisScalpelIsMine.x86_64
