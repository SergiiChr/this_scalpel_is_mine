# The GdUnit4 suites under tests/ are the executable source of truth. Smoke gates full regression and export.
name: Tests

# Pushes to main and develop only: a branch with a pull request is tested once, by the pull_request run.
# Each develop commit gets its own result: release verification cuts only from commits that passed.
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint:
    name: Lint and types (C# analyzers, ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Analyzers run as part of the build and fail it on any warning.
      - run: dotnet build --nologo ThisScalpelIsMine.csproj
      # Exported games build without the tests: their code must not lean on anything only the tests bring.
      - run: dotnet build --nologo -c ExportRelease ThisScalpelIsMine.csproj
      - run: dotnet format ThisScalpelIsMine.csproj --verify-no-changes
      # bpy is left out: it's a large download and the lint and type checks don't need it.
      - run: pip install -r requirements.txt ruff==0.16.9 mypy==2.3.1
      - run: ruff check tools build.py
      - run: ruff format --check tools build.py
      - run: mypy tools build.py
      - run: python -m unittest tools.test_build tools.test_keyframes

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      # CI doesn't check frame times, so every process runs beside others, as many as the runner has cores for.
      - run: tools/with_crash_stacks.sh ./build.py test --ci-run
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: |
            build/test-logs
            build/test-results
          if-no-files-found: warn

  regression:
    name: Functional regression and export
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - name: Everything else, headless
        run: tools/with_crash_stacks.sh ./build.py test --all --skip smoke --ci-run
      - run: SKIP_TESTS=1 ./build.py build
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: |
            build/test-logs
            build/test-results
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: ThisScalpelIsMine-linux
          path: build/ThisScalpelIsMine.x86_64
