name: Set up Godot
description: The .NET SDK, Godot and its export templates (cached between runs), then the C# build and the import.
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "10.0.x"
    - uses: actions/cache@v4
      with:
        path: |
          .tools
          ~/.local/share/godot/export_templates
          ~/.nuget/packages
        key: godot-${{ hashFiles('build.py', 'ThisScalpelIsMine.csproj') }}
    - run: ./build.py setup
      shell: bash
